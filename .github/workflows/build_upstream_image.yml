name: Build upstream image
on:
  push:
    branches:
      - master
      - r[0-9]+.[0-9]+
    paths-ignore:
      - 'experimental/**'
      - 'torchax/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: mt-l-x86iavx512-8-64
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    env:
      ECR_DOCKER_IMAGE_BASE: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/xla_base
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "308535385114"
      # This is to stage PyTorch/XLA base image for use in the upstream.
      # To allow the upstream workflow to access PyTorch/XLA build images, we
      # need to have them in the ECR. This is not expensive, and only pushes it
      # if image layers are not present in the repo.
      # Note: set push to false while testing a new image, so we do not
      # push to the upstream.
      - name: Build and stage image to ECR
        uses: pytorch/test-infra/.github/actions/docker-build-remote-buildkit@main
        with:
          context: .github/upstream
          tags: ${{ env.ECR_DOCKER_IMAGE_BASE }}:v1.3-lite
          push: true
